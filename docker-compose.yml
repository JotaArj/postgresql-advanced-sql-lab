name: postgresql-advanced-sql-challenge
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sql_challenge
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set a local password}
    ports:
      - "127.0.0.1:${LAB_PORT:-55432}:5432"
    volumes:
      - lab_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d sql_challenge"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  lab_data:
